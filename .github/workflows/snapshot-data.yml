name: Snapshot dashboard data

# Pulls fresh data from the Apps Script proxy for each HA and commits it
# as static JSON in /data. Dashboards fetch this file from the same origin,
# bypassing corporate firewalls that block script.googleusercontent.com.

on:
  schedule:
    # Every 15 minutes, but offset from :00/:15/:30/:45 — those are GitHub Actions
    # peak-load minutes and scheduled workflows get heavily throttled there.
    # Using :07/:22/:37/:52 dramatically improves on-time delivery.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}  # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: snapshot-data
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data for each HA
        env:
          PROXY: https://script.google.com/macros/s/AKfycbw5mxQzV4m9nFrhHGDboWNx_MtBJOvMJ9725_wkfEg9TrrG2H9bd6dQYVCWSMGYlNZ7/exec
        run: |
          mkdir -p data
          for HA in PHSA PHC VCH FHA VIHA IH NH; do
            for attempt in 1 2 3; do
              if curl -sS --fail --max-time 30 -L "$PROXY?ha=$HA" -o "data/$HA.json.tmp"; then
                # Validate JSON and check it has expected shape
                if python3 -c "import json,sys; d=json.load(open('data/$HA.json.tmp')); assert d.get('ha')=='$HA' and isinstance(d.get('data'), list); print(f'$HA: {d[\"count\"]} rows')"; then
                  mv "data/$HA.json.tmp" "data/$HA.json"
                  break
                fi
              fi
              echo "$HA attempt $attempt failed, retrying..."
              sleep $((attempt * 2))
            done
            rm -f "data/$HA.json.tmp"
          done
          ls -la data/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git add data/
          git commit -m "data: refresh snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Retry git push up to 5 times — guards against transient GitHub 5xx
          # and races with concurrent commits to main (rebase before each retry).
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Snapshot pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            if [ $attempt -lt 5 ]; then
              sleep $((attempt * 5))
              git pull --rebase --autostash || true
            fi
          done
          echo "All 5 push attempts failed."
          exit 1
